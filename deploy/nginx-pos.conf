# pos.mmds.site — Order Notebook (isolated vhost)
# Place in /etc/nginx/sites-available/pos.mmds.site
# Enable: ln -sf .../pos.mmds.site /etc/nginx/sites-enabled/
# Until DNS is ready, duplicate this block with listen 3011 and server_name _;

upstream order_notebook_api {
    server 127.0.0.1:3010;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name pos.mmds.site;

    root /opt/order-notebook/frontend/dist;
    index index.html;

    client_max_body_size 2m;

    location /api/v1/ {
        proxy_pass http://order_notebook_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|svg|ico|woff2|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# Temporary IP access (remove after DNS + certbot)
server {
    listen 3011;
    listen [::]:3011;
    server_name _;

    root /opt/order-notebook/frontend/dist;
    index index.html;

    location /api/v1/ {
        proxy_pass http://order_notebook_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
